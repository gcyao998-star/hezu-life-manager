<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="合租生活管家——让合租生活更清楚、更轻松。" />
    <title>合租生活管家</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f4f7f5;
        color: #17231d;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      main { padding: 32px; text-align: center; }
      .mark {
        width: 64px;
        height: 64px;
        margin: 0 auto 24px;
        display: grid;
        place-items: center;
        border-radius: 20px;
        background: #176b4d;
        color: white;
        font-size: 30px;
        box-shadow: 0 14px 36px rgba(23, 107, 77, .22);
      }
      h1 { margin: 0 0 12px; font-size: clamp(30px, 7vw, 48px); letter-spacing: -.04em; }
      p { margin: 0; color: #607068; font-size: 17px; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">⌂</div>
      <h1>合租生活管家</h1>
      <p>让每一笔费用、每一次值日，都清楚有回应。</p>
    </main>
  </body>
</html>
