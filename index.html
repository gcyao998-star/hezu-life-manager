<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7efdf" />
    <meta name="description" content="合租生活管家——把公约变成每个人都看得见的日常。" />
    <title>合租生活管家</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#app-main">跳到主要内容</a>

    <svg class="svg-sprite" aria-hidden="true">
      <symbol id="i-home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/></symbol>
      <symbol id="i-wallet" viewBox="0 0 24 24"><path d="M4 6.5h15a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-13a2 2 0 0 1 2-2h13"/><path d="M16 12h5v4h-5a2 2 0 0 1 0-4Z"/></symbol>
      <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></symbol>
      <symbol id="i-scroll" viewBox="0 0 24 24"><path d="M6 3h13v15a3 3 0 0 1-3 3H6a3 3 0 0 0 3-3V6a3 3 0 0 0-3-3Z"/><path d="M6 3a3 3 0 0 0-3 3v1h6M12 9h4M12 13h4"/></symbol>
      <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
      <symbol id="i-bell" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9ZM10 21h4"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
      <symbol id="i-users" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></symbol>
      <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
      <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
      <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></symbol>
      <symbol id="i-camera" viewBox="0 0 24 24"><path d="M14.5 5 13 3h-2L9.5 5H5a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2Z"/><circle cx="12" cy="12" r="4"/></symbol>
      <symbol id="i-edit" viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"/></symbol>
      <symbol id="i-log-out" viewBox="0 0 24 24"><path d="M10 17l5-5-5-5M15 12H3M15 3h5a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1h-5"/></symbol>
    </svg>

    <div class="page-backdrop" aria-hidden="true">
      <span class="backdrop-note note-one">一起住，也一起说清楚</span>
      <span class="backdrop-note note-two">HOUSEMATES · 04</span>
    </div>

    <section id="login-view" class="login-view" aria-labelledby="login-title">
      <div class="login-art-wrap">
        <span class="hand-note">欢迎回家</span>
        <img src="assets/illustrations/roommates.png" alt="四位室友一起拿着合租房钥匙的插画" />
      </div>
      <div class="login-copy">
        <p class="eyebrow">合租生活管家</p>
        <h1 id="login-title">住在一起，<br />也把话说清楚。</h1>
        <p>费用、轮值、预约和公约，大家共同决定。</p>
      </div>
      <div class="login-actions">
        <button class="button button-primary button-large" data-action="login-wechat">
          <span class="wechat-dot" aria-hidden="true">●</span> 微信快捷登录
        </button>
        <button class="button button-quiet" data-action="login-phone">使用手机号登录</button>
        <p class="legal">登录即表示你同意演示版隐私说明。本页面不会获取真实账号信息。</p>
      </div>
    </section>

    <div id="app-shell" class="app-shell" hidden>
      <header class="topbar">
        <button class="space-switch" data-action="space-switch" aria-label="切换合租空间">
          <span class="space-mark">晴舍</span>
          <span><strong>晴天小屋</strong><small>主要住所</small></span>
          <svg class="icon icon-sm"><use href="#i-chevron"></use></svg>
        </button>
        <button class="icon-button notification-button" data-action="notifications" aria-label="查看消息">
          <svg class="icon"><use href="#i-bell"></use></svg><span class="notification-dot" aria-label="3 条未读消息"></span>
        </button>
      </header>

      <main id="app-main" tabindex="-1"></main>

      <nav class="bottom-nav" aria-label="主要导航">
        <button data-route="home" class="nav-item is-active"><svg class="icon"><use href="#i-home"></use></svg><span>首页</span></button>
        <button data-route="expenses" class="nav-item"><svg class="icon"><use href="#i-wallet"></use></svg><span>费用</span></button>
        <button data-route="things" class="nav-item"><svg class="icon"><use href="#i-grid"></use></svg><span>事务</span></button>
        <button data-route="agreements" class="nav-item"><svg class="icon"><use href="#i-scroll"></use></svg><span>公约</span></button>
        <button data-route="profile" class="nav-item"><svg class="icon"><use href="#i-user"></use></svg><span>我的</span></button>
      </nav>
    </div>

    <div id="modal-root"></div>
    <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>
    <script src="app.js"></script>
  </body>
</html>
